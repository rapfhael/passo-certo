<title>Passo Certo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#F4FAF6;
    --surface:#FFFFFF;
    --ink:#1E3327;
    --ink-soft:#5C7568;
    --primary:#1F6F4F;
    --primary-light:#2F8F67;
    --accent:#4CAF7A;
    --accent-ink:#0D2B1C;
    --danger:#B3492F;
    --success:#2F8F67;
    --border:#DCEAE1;
    --radius:14px;
    --font-display:'Lora', Georgia, serif;
    --font-body:'Inter', -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg);}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;color:var(--primary);}
  a{color:inherit;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}

  .topbar{
    background:var(--primary);
    color:#F2FBF6;
    padding:16px 20px 14px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10;
  }
  .topbar-brand{display:flex;align-items:center;gap:10px;}
  .topbar-brand img{width:34px;height:34px;border-radius:9px;object-fit:cover;background:#fff;}
  .topbar h1{color:#F2FBF6;font-size:19px;letter-spacing:.2px;}
  .topbar .sub{font-size:12px;color:#CBEAD8;margin-top:2px;}
  .topbar-actions{display:flex;gap:8px;}
  .icon-btn{
    background:rgba(255,255,255,.14);border:none;color:#F2FBF6;
    width:36px;height:36px;border-radius:10px;font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }

  .content{flex:1;padding:16px 16px 90px;}

  .bottomnav{
    position:fixed;bottom:0;left:0;right:0;
    max-width:480px;margin:0 auto;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .navbtn{
    flex:1;background:none;border:none;display:flex;flex-direction:column;
    align-items:center;gap:2px;padding:8px 2px;border-radius:10px;color:var(--ink-soft);
    font-size:11px;
  }
  .navbtn .ic{font-size:20px;}
  .navbtn.active{color:var(--primary);background:#E7F5EE;}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;
  }
  .menu-card{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;margin-bottom:12px;
  }
  .menu-card .ic{font-size:26px;width:44px;height:44px;background:#E7F5EE;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .menu-card .txt strong{display:block;font-size:15px;color:var(--primary);font-family:var(--font-display);}
  .menu-card .txt span{font-size:12.5px;color:var(--ink-soft);}

  .list-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:13px 14px;margin-bottom:8px;
  }
  .list-item .name{font-weight:600;font-size:14.5px;}
  .list-item .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .tag{font-size:10.5px;padding:3px 8px;border-radius:999px;font-weight:600;}
  .tag.ativo{background:#E3F3EA;color:var(--success);}
  .tag.inativo{background:#F1E4DF;color:var(--danger);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;
    background:var(--surface);font-size:14.5px;color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .search-box{position:relative;margin-bottom:14px;}
  .search-box input{width:100%;padding:11px 12px 11px 36px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:14px;}
  .search-box .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:12px 18px;border-radius:10px;border:none;font-weight:600;font-size:14.5px;width:100%;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-secondary{background:var(--primary);color:#F2FBF6;}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--ink);}
  .btn-danger{background:#F1E4DF;color:var(--danger);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}
  .fab{
    position:fixed;bottom:86px;right:calc(50% - 240px + 18px);
    background:var(--accent);color:#fff;border:none;
    width:52px;height:52px;border-radius:16px;font-size:24px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.18);z-index:15;
  }
  @media (max-width:520px){.fab{right:18px;}}

  .overlay{
    position:fixed;inset:0;background:rgba(15,30,22,.45);z-index:30;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    background:var(--bg);width:100%;max-width:480px;border-radius:20px 20px 0 0;
    max-height:92vh;overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(16px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .sheet-head h2{font-size:18px;}
  .close-x{background:#E7F5EE;border:none;width:30px;height:30px;border-radius:9px;font-size:15px;color:var(--ink-soft);}

  .empty{text-align:center;padding:40px 12px;color:var(--ink-soft);}
  .empty .ic{font-size:34px;margin-bottom:8px;}
  .empty p{font-size:13.5px;margin:4px 0 0;}

  .divider{height:1px;background:var(--border);margin:16px 0;}
  .small{font-size:12px;color:var(--ink-soft);}
  .msg{font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:12px;}
  .msg.error{background:#F1E4DF;color:var(--danger);}
  .msg.ok{background:#E3F3EA;color:var(--success);}

  .check-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;
  }
  .check-row.presente{border-color:var(--success);background:#EEF8F1;}
  .toggle-pill{
    border:1.5px solid var(--border);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;
    background:var(--surface);color:var(--ink-soft);flex-shrink:0;
  }
  .toggle-pill.on{background:var(--success);border-color:var(--success);color:#fff;}

  .stat-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .stat{flex:1;min-width:90px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
  .stat .num{font-family:var(--font-display);font-size:20px;color:var(--primary);}
  .stat .lbl{font-size:10.5px;color:var(--ink-soft);}

  .center-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 26px;}
  .center-screen h1{font-size:24px;margin-bottom:4px;text-align:center;}
  .center-screen .lead{color:var(--ink-soft);font-size:13.5px;margin-bottom:24px;text-align:center;}
  .brand-logo{display:flex;justify-content:center;margin-bottom:10px;}
  .brand-logo img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 18px rgba(31,111,79,.18);}

  .chip-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);font-size:13px;background:var(--surface);color:var(--ink-soft);font-weight:600;}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#F2FBF6;}

  .report-block{margin-bottom:16px;}
  .report-band{background:#96E0BE;color:#153A2A;font-weight:700;font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:8px;}
  .report-block .sub{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
  .pill-list{display:flex;flex-wrap:wrap;gap:6px;}
  .pill-list span{background:#E7F5EE;color:var(--primary);font-size:12px;padding:4px 10px;border-radius:999px;}
  .mini-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px;}
  .mini-table th{text-align:left;color:var(--ink-soft);font-size:11px;font-weight:600;padding:2px 6px 4px 0;}
  .mini-table td{padding:3px 6px 3px 0;color:var(--ink);}
</style>
</head>

/* ============ CAMADA DE DADOS (localStorage) ============ */
const DB = {
  get(key, def){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }catch(e){ return def; } },
  set(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
};
const KEYS = { alunos:'pc_alunos', aulas:'pc_aulas', presencas:'pc_presencas', usuarios:'pc_usuarios', fbConfig:'pc_firebase_config' };

let state = {
  alunos: DB.get(KEYS.alunos, []),
  aulas: DB.get(KEYS.aulas, []),
  presencas: DB.get(KEYS.presencas, []),
  usuarios: DB.get(KEYS.usuarios, null) || [{codigo:0, nome:'Administrador', senhaHash:MASTER_HASH, dataDesativacao:null}],
  session: sessionStorage.getItem('pc_session') === '1',
  sessionUserCodigo: sessionStorage.getItem('pc_session_user') ? Number(sessionStorage.getItem('pc_session_user')) : null,
  screen: 'home',
  editAlunoId: null,
  editUsuarioCodigo: null,
  currentAulaId: null,
  reportType: 'aula',
  msg: null
};
function persist(){
  DB.set(KEYS.alunos, state.alunos);
  DB.set(KEYS.aulas, state.aulas);
  DB.set(KEYS.presencas, state.presencas);
  DB.set(KEYS.usuarios, state.usuarios);
}
persist();
function nextId(arr, campo){ campo = campo || 'id'; return arr.length ? Math.max(...arr.map(x=>x[campo])) + 1 : 1; }
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtNum(n){ if(!isFinite(n)) return '0'; return Number.isInteger(n) ? String(n) : n.toFixed(1); }
function currentUser(){ return state.usuarios.find(u=>u.codigo===state.sessionUserCodigo); }

/* ============ FIREBASE (nuvem gratuita, opcional) ============ */
let fb = { db:null, auth:null, uid:null, ready:false, initStarted:false, error:null };
function loadFirebaseConfig(){ return DB.get(KEYS.fbConfig, null); }
function saveFirebaseConfig(cfg){ DB.set(KEYS.fbConfig, cfg); }
async function initFirebaseIfConfigured(){
  if(fb.initStarted) return;
  const cfg = loadFirebaseConfig();
  if(!cfg) return;
  fb.initStarted = true;
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    fb.db = firebase.firestore();
    fb.auth = firebase.auth();
    try{ await fb.db.enablePersistence({synchronizeTabs:true}); }catch(e){}
    const cred = await fb.auth.signInAnonymously();
    fb.uid = cred.user.uid;
    fb.ready = true;
    await syncInicial();
  }catch(e){
    console.error('Falha ao conectar ao Firebase', e);
    fb.error = e.message; fb.ready = false;
  }
}
function colAlunos(){ return fb.db.collection('users').doc(fb.uid).collection('alunos'); }
function colAulas(){ return fb.db.collection('users').doc(fb.uid).collection('aulas'); }
function colPresencas(){ return fb.db.collection('users').doc(fb.uid).collection('presencas'); }
function colUsuarios(){ return fb.db.collection('users').doc(fb.uid).collection('usuarios'); }

async function syncInicial(){
  const [snapA, snapU, snapP, snapUs] = await Promise.all([colAlunos().get(), colAulas().get(), colPresencas().get(), colUsuarios().get()]);
  const cloudVazio = snapA.empty && snapU.empty && snapP.empty && snapUs.empty;
  if(cloudVazio && (state.alunos.length || state.aulas.length || state.presencas.length || state.usuarios.length)){
    await pushTudo();
  } else {
    if(!snapA.empty) state.alunos = snapA.docs.map(d=>d.data());
    if(!snapU.empty) state.aulas = snapU.docs.map(d=>d.data());
    if(!snapP.empty) state.presencas = snapP.docs.map(d=>d.data());
    if(!snapUs.empty) state.usuarios = snapUs.docs.map(d=>d.data());
    persist();
  }
  render();
}
async function pushTudo(){
  if(!fb.ready) return;
  const ops = [];
  state.alunos.forEach(a=> ops.push(colAlunos().doc(String(a.id)).set(a)));
  state.aulas.forEach(a=> ops.push(colAulas().doc(String(a.id)).set(a)));
  state.presencas.forEach(p=> ops.push(colPresencas().doc(String(p.id)).set(p)));
  state.usuarios.forEach(u=> ops.push(colUsuarios().doc(String(u.codigo)).set(u)));
  await Promise.all(ops);
}
function pushAluno(a){ if(fb.ready) colAlunos().doc(String(a.id)).set(a).catch(e=>console.error(e)); }
function pushAula(a){ if(fb.ready) colAulas().doc(String(a.id)).set(a).catch(e=>console.error(e)); }
function pushPresencas(list){ if(!fb.ready) return; list.forEach(p=> colPresencas().doc(String(p.id)).set(p).catch(e=>console.error(e))); }
function pushUsuario(u){ if(fb.ready) colUsuarios().doc(String(u.codigo)).set(u).catch(e=>console.error(e)); }
async function forcarSyncNuvem(){
  if(!fb.ready) return;
  const [snapA, snapU, snapP, snapUs] = await Promise.all([colAlunos().get(), colAulas().get(), colPresencas().get(), colUsuarios().get()]);
  state.alunos = snapA.docs.map(d=>d.data());
  state.aulas = snapU.docs.map(d=>d.data());
  state.presencas = snapP.docs.map(d=>d.data());
  state.usuarios = snapUs.docs.map(d=>d.data());
  persist(); closeSheet(); render();
}

/* ============ SENHA (hash) ============ */
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ============ RENDER ============ */
const root = document.getElementById('app');
function render(){
  if(!state.session) return renderLogin();
  const u = currentUser();
  root.innerHTML = `
    <div class="topbar">
      <div class="topbar-brand">
        <img src="${LOGO_DATA_URL}" alt="Passo Certo">

      </div>
      <div class="topbar-actions">

        <button class="icon-btn" onclick="doLogout()" title="Sair">⏻</button>
      </div>
    </div>
    <div class="content" id="content"></div>
    ${bottomNav()}
  `;

}
function bottomNav(){
  const items = [
    {id:'home', ic:'🏠', lbl:'Início'},
    {id:'alunos', ic:'👥', lbl:'Alunos'},
    {id:'historico', ic:'✅', lbl:'Aulas'},
    {id:'relatorios', ic:'📊', lbl:'Relatórios'}
  ];
  return `<div class="bottomnav">
    ${items.map(i=>`<button class="navbtn ${state.screen===i.id?'active':''}" onclick="goTo('${i.id}')">
      <span class="ic">${i.ic}</span>${i.lbl}
    </button>`).join('')}
  </div>`;
}
function goTo(screen){
  if(screen==='usuarios' && (!currentUser() || currentUser().codigo!==0)) screen='home';
  state.screen = screen; state.msg=null; render();
}
function renderScreen(){
  const c = document.getElementById('content');
  if(state.screen==='home') c.innerHTML = viewHome();
  else if(state.screen==='alunos') c.innerHTML = viewAlunos();
  else if(state.screen==='historico') c.innerHTML = viewHistorico();
  else if(state.screen==='chamada') c.innerHTML = viewChamada();
  else if(state.screen==='relatorios') c.innerHTML = viewRelatorios();
  else if(state.screen==='usuarios') c.innerHTML = viewUsuarios();
}

/* ---------- LOGIN ---------- */
function renderLogin(){
  root.innerHTML = `
  <div class="center-screen">
    <div class="brand-logo"><img src="${LOGO_DATA_URL}" alt="Passo Certo"></div>
    <h1>Passo Certo</h1>
    <p class="lead">Controle de presença — ginástica funcional</p>
    <div id="loginMsg"></div>
    <div class="field"><label>Código do usuário</label><input id="lc" type="number" inputmode="numeric" placeholder="Ex: 0"></div>
    <div class="field"><label>Senha</label><input id="lp" type="password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary" onclick="doLogin()">Entrar</button>
  </div>`;
}
async function doLogin(){
  const codigoTxt = document.getElementById('lc').value;
  const senha = document.getElementById('lp').value;
  const msg = document.getElementById('loginMsg');
  if(codigoTxt===''){ msg.innerHTML='<div class="msg error">Informe o código do usuário.</div>'; return; }
  const codigo = Number(codigoTxt);
  const usuario = state.usuarios.find(u=>u.codigo===codigo);
  if(!usuario){ msg.innerHTML='<div class="msg error">Código não encontrado.</div>'; return; }
  if(usuario.dataDesativacao){ msg.innerHTML='<div class="msg error">Usuário desativado. Fale com o administrador.</div>'; return; }
  const h = await sha256(senha);
  if(h !== usuario.senhaHash){ msg.innerHTML='<div class="msg error">Senha incorreta.</div>'; return; }
  state.session = true; state.sessionUserCodigo = codigo;
  sessionStorage.setItem('pc_session','1'); sessionStorage.setItem('pc_session_user', String(codigo));
  render();
  initFirebaseIfConfigured();
}
function doLogout(){ state.session=false; state.sessionUserCodigo=null; sessionStorage.removeItem('pc_session'); sessionStorage.removeItem('pc_session_user'); render(); }

function openUsuarioForm(codigo){
  state.editUsuarioCodigo = codigo;
  const u = codigo!==null ? state.usuarios.find(x=>x.codigo===codigo) : null;
  showSheet(`
    <div class="sheet-head"><h2>${u?'Editar usuário':'Novo usuário'}</h2><button class="close-x" onclick="closeSheet()">✕</button></div>
    <div id="usuarioMsg"></div>
    ${u?`<p class="small">Código: <strong>${u.codigo}</strong></p>`:''}
    <div class="field"><label>Nome *</label><input id="uNome" value="${u?u.nome:''}"></div>

    <button class="btn btn-primary" onclick="salvarUsuario()">Salvar</button>
    ${u && u.codigo!==0?`<div class="btn-row" style="margin-top:10px">
      <button class="btn ${u.dataDesativacao?'btn-outline':'btn-danger'}" onclick="toggleAtivoUsuario(${u.codigo})">${u.dataDesativacao?'Reativar usuário':'Desativar usuário'}</button>
    </div>`:''}
  `);

function salvarUsuario(){
  const nome = document.getElementById('uNome').value.trim();
  const senha = document.getElementById('uSenha').value;
  const msg = document.getElementById('usuarioMsg');
  if(!nome){ msg.innerHTML='<div class="msg error">Informe o nome do usuário.</div>'; return; }
  if(state.editUsuarioCodigo===null){
    if(senha.length<4){ msg.innerHTML='<div class="msg error">A senha precisa ter pelo menos 4 caracteres.</div>'; return; }
    sha256(senha).then(hash=>{
      const novo = {codigo: nextId(state.usuarios,'codigo'), nome, senhaHash: hash, dataDesativacao:null};
      state.usuarios.push(novo);
      persist(); pushUsuario(novo); closeSheet(); renderScreen();
    });
  } else {
    if(senha && senha.length<4){ msg.innerHTML='<div class="msg error">A nova senha precisa ter pelo menos 4 caracteres.</div>'; return; }
    const u = state.usuarios.find(x=>x.codigo===state.editUsuarioCodigo);
    const salvar = ()=>{ u.nome = nome; persist(); pushUsuario(u); closeSheet(); renderScreen(); };
    if(senha){ sha256(senha).then(hash=>{ u.senhaHash = hash; salvar(); }); }
    else salvar();
  }
}
function toggleAtivoUsuario(codigo){
  if(codigo===0) return;
  const u = state.usuarios.find(x=>x.codigo===codigo);
  u.dataDesativacao = u.dataDesativacao ? null : todayISO();
  persist(); pushUsuario(u); closeSheet(); renderScreen();
}

  showSheet(`

function excluirAula(id){
  const removidas = state.presencas.filter(p=>p.idAula===id);
  state.aulas = state.aulas.filter(a=>a.id!==id);
  state.presencas = state.presencas.filter(p=>p.idAula!==id);
  persist();
  if(fb.ready){
    colAulas().doc(String(id)).delete().catch(e=>console.error(e));
    removidas.forEach(p=> colPresencas().doc(String(p.id)).delete().catch(e=>console.error(e)));
  }
  closeSheet(); renderScreen();
}

/* ---------- CHAMADA ---------- */
let chamadaSearch = '';
let chamadaMarcados = null;
function viewChamada(){
  const aula = state.aulas.find(a=>a.id===state.currentAulaId);
  if(!aula) return `<div class="empty"><p>Aula não encontrada.</p></div>`;
  const existentes = state.presencas.filter(p=>p.idAula===aula.id);
  if(chamadaMarcados===null){
    chamadaMarcados = new Set(existentes.filter(p=>p.status==='PRESENTE').map(p=>p.idAluno));
  }
  const ativos = state.alunos.filter(a=>!a.dataDesativacao)
    .filter(a=>!chamadaSearch || a.nome.toLowerCase().includes(chamadaSearch.toLowerCase()))
    .sort((a,b)=>a.nome.localeCompare(b.nome));
  const totalPresentes = chamadaMarcados.size;
  return `
  <button class="btn btn-outline" style="margin-bottom:12px" onclick="chamadaMarcados=null; goTo('historico')">← Voltar</button>
  <h2 style="margin-bottom:4px">Aula de ${fmtDate(aula.data)}</h2>
  <p class="small" style="margin-bottom:12px">${aula.observacoes||'Sem observações'} · ${totalPresentes} presente(s) de ${state.alunos.filter(a=>!a.dataDesativacao).length} ativos</p>
  <div class="search-box"><span class="ic">🔍</span><input placeholder="Buscar aluno" value="${chamadaSearch}" oninput="chamadaSearch=this.value; renderScreen()"></div>
  ${ativos.length===0? `<div class="empty"><p>Nenhum aluno ativo cadastrado.</p></div>` :
    ativos.map(a=>{
      const on = chamadaMarcados.has(a.id);
      return `<div class="check-row ${on?'presente':''}" onclick="toggleMarcado(${a.id})">
        <span>${a.nome}</span>
        <span class="toggle-pill ${on?'on':''}">${on?'✓ Presente':'Ausente'}</span>
      </div>`;
    }).join('')}
  <div style="height:14px"></div>
  <button class="btn btn-secondary" onclick="confirmarFinalizar(${aula.id})">Finalizar aula</button>
  `;
}
function toggleMarcado(id){
  if(chamadaMarcados.has(id)) chamadaMarcados.delete(id); else chamadaMarcados.add(id);
  renderScreen();
}
function confirmarFinalizar(aulaId){
  const ativos = state.alunos.filter(a=>!a.dataDesativacao);
  const presentes = chamadaMarcados.size;
  const ausentes = ativos.length - presentes;
  showSheet(`
    <div class="sheet-head"><h2>Confirmar chamada</h2><button class="close-x" onclick="closeSheet()">✕</button></div>
    <p>Você está prestes a gravar esta chamada definitivamente:</p>
    <div class="stat-row">
      <div class="stat"><div class="num">${presentes}</div><div class="lbl">Presentes</div></div>
      <div class="stat"><div class="num">${ausentes}</div><div class="lbl">Ausentes</div></div>
    </div>
    <button class="btn btn-primary" onclick="finalizarAula(${aulaId})">Confirmar e gravar</button>
    <button class="btn btn-outline" style="margin-top:10px" onclick="closeSheet()">Cancelar</button>
  `);
}
function finalizarAula(aulaId){
  state.presencas = state.presencas.filter(p=>p.idAula!==aulaId);
  const novos = state.alunos.filter(a=>!a.dataDesativacao).map(a=>({
    id: `${aulaId}_${a.id}`,
    idAluno: a.id, idAula: aulaId,
    status: chamadaMarcados.has(a.id) ? 'PRESENTE' : 'AUSENTE'
  }));
  state.presencas.push(...novos);
  persist(); pushPresencas(novos); closeSheet(); chamadaMarcados=null;
  state.screen='historico'; render();
}

function relatorioAulaForm(){

function relatorioAlunoForm(){

    <div class="field"><label>Data final</label><input id="rfDataFim2" type="date"></div>
    <button class="btn btn-primary" onclick="gerarRelatorioAluno()">Gerar relatório</button>
  </div>
  <div id="reportResult"></div>
  `;

let lastReport = null;

function periodoTextoHTML(p){
  if(p && (p.ini || p.fim)) return `${p.ini?fmtDate(p.ini):'Início'} a ${p.fim?fmtDate(p.fim):'hoje'}`;
  return 'Todo o período';
}

function gerarRelatorioAula(){
  const iniRaw = document.getElementById('rfDataIni').value;
  const fimRaw = document.getElementById('rfDataFim').value;
  const ini = iniRaw || '0000-01-01';
  const fim = fimRaw || '9999-12-31';
  const aulas = state.aulas.filter(a=>a.data>=ini && a.data<=fim).sort((a,b)=>a.data.localeCompare(b.data));
  const distintos = new Set();
  let somaPresentes = 0;
  const dados = aulas.map(au=>{
    const presentesIds = state.presencas.filter(p=>p.idAula===au.id && p.status==='PRESENTE').map(p=>p.idAluno);
    presentesIds.forEach(id=>distintos.add(id));
    somaPresentes += presentesIds.length;
    const nomes = presentesIds.map(id=>state.alunos.find(a=>a.id===id)?.nome).filter(Boolean).sort((a,b)=>a.localeCompare(b));
    return { aula: au, nomes };
  });
  const totais = { totalAulas: aulas.length, totalAlunosDistintos: distintos.size, mediaAlunosPorAula: aulas.length ? somaPresentes/aulas.length : 0 };
  lastReport = {tipo:'aula', dados, totais, periodo:{ini:iniRaw||null, fim:fimRaw||null}};
  const html = dados.length===0 ? `<div class="empty"><p>Nenhuma aula encontrada no período.</p></div>` :
    dados.map(d=>`<div class="report-block">
      <div class="report-band">Aula: ${d.aula.id} &nbsp;&nbsp; Observação: ${d.aula.observacoes || 'Sem observação'}</div>
      <div class="pill-list">${d.nomes.length? d.nomes.map(n=>`<span>${n}</span>`).join('') : '<span>Nenhum presente</span>'}</div>
    </div>`).join('');
  document.getElementById('reportResult').innerHTML = `
    <p class="small" style="margin-bottom:10px">Período: ${periodoTextoHTML(lastReport.periodo)}</p>
    ${html}
    <div class="stat-row">
      <div class="stat"><div class="num">${totais.totalAulas}</div><div class="lbl">Aulas no período</div></div>
      <div class="stat"><div class="num">${totais.totalAlunosDistintos}</div><div class="lbl">Alunos distintos</div></div>
      <div class="stat"><div class="num">${fmtNum(totais.mediaAlunosPorAula)}</div><div class="lbl">Média/aula</div></div>
    </div>
    ${exportButtons()}
  `;
}
function gerarRelatorioAluno(){
  const alunoIdSel = document.getElementById('rfNome').value;
  const iniRaw = document.getElementById('rfDataIni2').value;
  const fimRaw = document.getElementById('rfDataFim2').value;
  const ini = iniRaw || '0000-01-01';
  const fim = fimRaw || '9999-12-31';
  const alunos = state.alunos.filter(a=> !alunoIdSel || a.id===Number(alunoIdSel)).sort((a,b)=>a.nome.localeCompare(b.nome));
  const aulasDistintas = new Set();
  let somaPresencas = 0;
  const dados = alunos.map(al=>{
    const aulas = state.presencas.filter(p=>p.idAluno===al.id && p.status==='PRESENTE')
      .map(p=>state.aulas.find(a=>a.id===p.idAula))
      .filter(a=>a && a.data>=ini && a.data<=fim)
      .sort((a,b)=>a.data.localeCompare(b.data));
    aulas.forEach(a=>aulasDistintas.add(a.id));
    somaPresencas += aulas.length;
    return {aluno: al, aulas};
  });
  const totais = { totalAlunos: alunos.length, totalAulasDistintas: aulasDistintas.size, mediaPresencaAluno: alunos.length ? somaPresencas/alunos.length : 0 };
  lastReport = {tipo:'aluno', dados, totais, periodo:{ini:iniRaw||null, fim:fimRaw||null}};
  const html = dados.length===0 ? `<div class="empty"><p>Nenhum aluno encontrado.</p></div>` :
    dados.map((d,idx)=>`<div class="report-block">
      <div class="report-band">${idx+1} - ${d.aluno.nome}</div>
      ${d.aulas.length===0 ? `<p class="small">Nenhuma presença no período</p>` : `
      <table class="mini-table">
        <tr><th>Aula</th><th>Data</th><th>Observação</th></tr>
        ${d.aulas.map(a=>`<tr><td>${a.id}</td><td>${fmtDate(a.data)}</td><td>${a.observacoes||'—'}</td></tr>`).join('')}
      </table>`}
    </div>`).join('');
  document.getElementById('reportResult').innerHTML = `
    <p class="small" style="margin-bottom:10px">Período: ${periodoTextoHTML(lastReport.periodo)}</p>
    ${html}
    <div class="stat-row">
      <div class="stat"><div class="num">${totais.totalAlunos}</div><div class="lbl">Alunos no período</div></div>
      <div class="stat"><div class="num">${totais.totalAulasDistintas}</div><div class="lbl">Aulas distintas</div></div>
      <div class="stat"><div class="num">${fmtNum(totais.mediaPresencaAluno)}</div><div class="lbl">Média presença</div></div>
    </div>
    ${exportButtons()}
  `;
}
function exportButtons(){
  return `<div class="btn-row" style="margin-top:6px">
    <button class="btn btn-outline" onclick="exportarPDF()">📄 Exportar PDF</button>
    <button class="btn btn-outline" onclick="exportarExcel()">📊 Exportar Excel</button>
  </div>`;
}

/* ---------- EXPORTAÇÃO PDF (cabeçalho com logo, bandas, totais) ---------- */
function exportarPDF(){
  if(!lastReport) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 14;
  const bandColor = [150,224,190];
  const bandText = [21,58,42];
  const contentWidth = pageWidth - margin*2;

  function desenharCabecalhoCompleto(){
    try{ doc.addImage(LOGO_DATA_URL, 'PNG', margin, 8, 20, 20); }catch(e){}
    doc.setTextColor(31,58,52); doc.setFont(undefined,'normal'); doc.setFontSize(11);
    doc.text('Relatório', pageWidth/2, 16, {align:'center'});
    doc.setFont(undefined,'bold'); doc.setFontSize(15);
    doc.text(lastReport.tipo==='aula' ? 'Aulas x Alunos' : 'Alunos X Aulas', pageWidth/2, 24, {align:'center'});
    doc.setFont(undefined,'normal'); doc.setFontSize(8); doc.setTextColor(90,100,95);
    doc.text('Data Emissão', pageWidth-margin, 11, {align:'right'});
    doc.setFontSize(9); doc.setTextColor(34,49,44);
    doc.text(new Date().toLocaleDateString('pt-BR'), pageWidth-margin, 16, {align:'right'});
    doc.setFontSize(8); doc.setTextColor(90,100,95);
    doc.text('Período:', pageWidth-margin, 23, {align:'right'});
    doc.setFontSize(9); doc.setTextColor(34,49,44);
    doc.text(periodoTextoHTML(lastReport.periodo), pageWidth-margin, 28, {align:'right'});
    doc.setDrawColor(220,234,225);
    doc.line(margin, 33, pageWidth-margin, 33);
  }
  function desenharCabecalhoMini(){
    doc.setFont(undefined,'bold'); doc.setFontSize(10); doc.setTextColor(31,58,52);
    doc.text('Passo Certo — continuação', margin, 14);
    doc.setDrawColor(220,234,225);
    doc.line(margin, 18, pageWidth-margin, 18);
  }
  desenharCabecalhoCompleto();
  let y = 42;
  function novaPagina(){ doc.addPage(); desenharCabecalhoMini(); y = 26; }
  function garantirEspaco(altura){ if(y + altura > pageHeight - 26) novaPagina(); }

  if(lastReport.tipo==='aula'){
    lastReport.dados.forEach(d=>{
      garantirEspaco(16);
      doc.setFillColor(bandColor[0],bandColor[1],bandColor[2]);
      doc.rect(margin, y, contentWidth, 8, 'F');
      doc.setTextColor(bandText[0],bandText[1],bandText[2]); doc.setFont(undefined,'bold'); doc.setFontSize(9.5);
      doc.text(`Aula: ${d.aula.id}    Observação: ${d.aula.observacoes || 'Sem observação'}`, margin+3, y+5.5);
      y += 8 + 5;
      doc.setFont(undefined,'normal'); doc.setFontSize(9); doc.setTextColor(34,49,44);
      const texto = d.nomes.length ? d.nomes.join(', ') : 'Nenhum aluno presente';
      const linhas = doc.splitTextToSize(texto, contentWidth);
      garantirEspaco(linhas.length*4.5 + 10);
      doc.text(linhas, margin, y);
      y += linhas.length*4.5 + 10;
    });
    garantirEspaco(28);
    doc.setDrawColor(220,234,225); doc.line(margin, y, pageWidth-margin, y); y += 6;
    doc.setFont(undefined,'normal'); doc.setFontSize(9); doc.setTextColor(34,49,44);
    doc.text(`Total de aulas no período: ${lastReport.totais.totalAulas}`, pageWidth-margin, y, {align:'right'}); y+=5;
    doc.text(`Total de alunos presentes: ${lastReport.totais.totalAlunosDistintos} (distintos)`, pageWidth-margin, y, {align:'right'}); y+=5;
    doc.text(`Média de alunos por aula: ${fmtNum(lastReport.totais.mediaAlunosPorAula)}`, pageWidth-margin, y, {align:'right'});
  } else {
    lastReport.dados.forEach((d,idx)=>{
      garantirEspaco(20);
      doc.setFillColor(bandColor[0],bandColor[1],bandColor[2]);
      doc.rect(margin, y, contentWidth, 8, 'F');
      doc.setTextColor(bandText[0],bandText[1],bandText[2]); doc.setFont(undefined,'bold'); doc.setFontSize(9.5);
      doc.text(`${idx+1} - ${d.aluno.nome}`, margin+3, y+5.5);
      y += 8 + 5;
      if(d.aulas.length===0){
        doc.setFont(undefined,'normal'); doc.setFontSize(9); doc.setTextColor(34,49,44);
        doc.text('Nenhuma presença no período', margin, y); y += 9;
      } else {
        doc.setFont(undefined,'bold'); doc.setFontSize(8); doc.setTextColor(90,100,95);
        doc.text('Aula', margin, y); doc.text('Data', margin+28, y); doc.text('Observação', margin+56, y);
        y += 5;
        doc.setFont(undefined,'normal'); doc.setFontSize(9); doc.setTextColor(34,49,44);
        d.aulas.forEach(a=>{
          garantirEspaco(6);
          doc.text(String(a.id), margin, y);
          doc.text(fmtDate(a.data), margin+28, y);
          const obsLinhas = doc.splitTextToSize(a.observacoes || '—', contentWidth-56);
          doc.text(obsLinhas, margin+56, y);
          y += Math.max(5, obsLinhas.length*4.5);
        });
        y += 4;
      }
    });
    garantirEspaco(28);
    doc.setDrawColor(220,234,225); doc.line(margin, y, pageWidth-margin, y); y += 6;
    doc.setFont(undefined,'normal'); doc.setFontSize(9); doc.setTextColor(34,49,44);
    doc.text(`Total de alunos no período: ${lastReport.totais.totalAlunos}`, pageWidth-margin, y, {align:'right'}); y+=5;
    doc.text(`Total de aulas no período: ${lastReport.totais.totalAulasDistintas}`, pageWidth-margin, y, {align:'right'}); y+=5;
    doc.text(`Média de presença do aluno: ${fmtNum(lastReport.totais.mediaPresencaAluno)}`, pageWidth-margin, y, {align:'right'});
  }
  const totalPages = doc.internal.getNumberOfPages();
  for(let i=1;i<=totalPages;i++){
    doc.setPage(i);
    doc.setFontSize(8); doc.setTextColor(140,140,140); doc.setFont(undefined,'normal');
    doc.text(`Página ${i} de ${totalPages}`, pageWidth-margin, pageHeight-8, {align:'right'});
    doc.text('Passo Certo · relatório de presença', margin, pageHeight-8);
  }
  doc.save('passo-certo-relatorio.pdf');
}

function exportarExcel(){
  if(!lastReport) return;
  let rows = [];
  if(lastReport.tipo==='aula'){
    rows.push(['Aula','Data','Observação','Aluno presente']);
    lastReport.dados.forEach(d=>{
      if(d.nomes.length===0) rows.push([d.aula.id, fmtDate(d.aula.data), d.aula.observacoes||'', '']);
      else d.nomes.forEach((n,i)=> rows.push([i===0?d.aula.id:'', i===0?fmtDate(d.aula.data):'', i===0?(d.aula.observacoes||''):'', n]));
    });
  } else {
    rows.push(['Aluno','Aula','Data','Observação']);
    lastReport.dados.forEach(d=>{
      if(d.aulas.length===0) rows.push([d.aluno.nome, '', '', '']);
      else d.aulas.forEach((a,i)=> rows.push([i===0?d.aluno.nome:'', a.id, fmtDate(a.data), a.observacoes||'']));
    });
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Relatorio');
  XLSX.writeFile(wb, 'passo-certo-relatorio.xlsx');
}

/* ---------- CONFIGURAÇÕES / NUVEM ---------- */
function openConfiguracoes(){
  const cfg = loadFirebaseConfig();
  showSheet(`
    <div class="sheet-head"><h2>Nuvem (Firebase)</h2><button class="close-x" onclick="closeSheet()">✕</button></div>
    <p class="small">Conecte um banco de dados gratuito na nuvem (Firebase) para não depender só deste celular. Status: <strong>${fb.ready?'🟢 Conectado':(fb.error?'🔴 Erro ao conectar':'⚪ Não conectado')}</strong></p>
    ${fb.error?`<div class="msg error">${fb.error}</div>`:''}
    <div class="field"><label>Cole aqui o firebaseConfig copiado do console do Firebase</label>
      <textarea id="fbConfigInput" rows="7" placeholder='{ apiKey: "...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." }'>${cfg?JSON.stringify(cfg,null,2):''}</textarea>
    </div>
    <div id="fbMsg"></div>
    <button class="btn btn-primary" onclick="salvarConfigFirebase()">Salvar e conectar</button>
    ${fb.ready?`
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn-outline" onclick="forcarSyncNuvem()">🔄 Puxar da nuvem</button>
      <button class="btn btn-outline" onclick="pushTudo().then(()=>{ document.getElementById('fbMsg').innerHTML='<div class=\\'msg ok\\'>Dados enviados para a nuvem.</div>'; })">⬆️ Enviar local</button>
    </div>`:''}
  `);
}
function salvarConfigFirebase(){
  const txt = document.getElementById('fbConfigInput').value.trim();
  const msg = document.getElementById('fbMsg');
  let cfg;
  try{ cfg = JSON.parse(txt); }
  catch(e){
    try{ cfg = new Function('return (' + txt + ')')(); }
    catch(e2){ msg.innerHTML = '<div class="msg error">Não consegui entender o texto colado. Copie exatamente o bloco firebaseConfig do console do Firebase.</div>'; return; }
  }
  saveFirebaseConfig(cfg);
  fb.initStarted = false; fb.ready = false; fb.error = null;
  msg.innerHTML = '<div class="msg ok">Configuração salva. Conectando...</div>';
  initFirebaseIfConfigured().then(()=>{ closeSheet(); render(); });
}

/* ---------- BACKUP MANUAL (arquivo) ---------- */
function openBackup(){
  showSheet(`
    <div class="sheet-head"><h2>Backup manual</h2><button class="close-x" onclick="closeSheet()">✕</button></div>
    <p class="small">Além da nuvem, você pode baixar um arquivo com todos os dados a qualquer momento.</p>
    <button class="btn btn-primary" onclick="exportarBackup()">⬇️ Baixar backup (.json)</button>
    <div class="divider"></div>
    <label class="field"><label>Restaurar backup</label>
      <input type="file" id="restoreFile" accept="application/json">
    </label>
    <button class="btn btn-outline" onclick="restaurarBackup()">⬆️ Restaurar a partir de arquivo</button>
  `);
}
function exportarBackup(){
  const data = { alunos: state.alunos, aulas: state.aulas, presencas: state.presencas, usuarios: state.usuarios, exportadoEm: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `passo-certo-backup-${todayISO()}.json`;
  a.click(); URL.revokeObjectURL(url);
}
function restaurarBackup(){
  const file = document.getElementById('restoreFile').files[0];
  if(!file) return alert('Escolha um arquivo de backup primeiro.');
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('Isso vai substituir os dados atuais pelos dados do backup. Continuar?')) return;
      state.alunos = data.alunos||[]; state.aulas = data.aulas||[]; state.presencas = data.presencas||[];
      state.usuarios = data.usuarios || [{codigo:0, nome:'Administrador', senhaHash:MASTER_HASH, dataDesativacao:null}];
      persist(); if(fb.ready) pushTudo(); closeSheet(); render();
    }catch(err){ alert('Arquivo de backup inválido.'); }
  };
  reader.readAsText(file);
}

/* ---------- SHEET (modal) ---------- */
function showSheet(html){
  let ov = document.getElementById('overlay');
  if(!ov){ ov = document.createElement('div'); ov.id='overlay'; ov.className='overlay'; document.body.appendChild(ov); }
  ov.innerHTML = `<div class="sheet">${html}</div>`;
  ov.onclick = (e)=>{ if(e.target===ov) closeSheet(); };
}
function closeSheet(){ const ov = document.getElementById('overlay'); if(ov) ov.remove(); }

render();
if(state.session) initFirebaseIfConfigured();
</script>

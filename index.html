<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F3A34">
<title>Passo Certo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#FAF6EE;
    --surface:#FFFFFF;
    --ink:#22312C;
    --ink-soft:#5B6A62;
    --primary:#1F3A34;
    --primary-light:#2E5347;
    --accent:#C99A3B;
    --accent-ink:#3A2C0B;
    --danger:#B3492F;
    --success:#4C7A5A;
    --border:#E4DCC9;
    --radius:14px;
    --font-display:'Lora', Georgia, serif;
    --font-body:'Inter', -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg);}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;color:var(--primary);}
  a{color:inherit;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}

  .topbar{
    background:var(--primary);
    color:#F4EFE2;
    padding:18px 20px 16px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10;
  }
  .topbar h1{color:#F4EFE2;font-size:20px;letter-spacing:.2px;}
  .topbar .sub{font-size:12px;color:#C9D6CC;margin-top:2px;}
  .topbar-actions{display:flex;gap:8px;}
  .icon-btn{
    background:rgba(255,255,255,.12);border:none;color:#F4EFE2;
    width:36px;height:36px;border-radius:10px;font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }

  .content{flex:1;padding:16px 16px 90px;}

  .bottomnav{
    position:fixed;bottom:0;left:0;right:0;
    max-width:480px;margin:0 auto;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .navbtn{
    flex:1;background:none;border:none;display:flex;flex-direction:column;
    align-items:center;gap:2px;padding:8px 2px;border-radius:10px;color:var(--ink-soft);
    font-size:11px;
  }
  .navbtn .ic{font-size:20px;}
  .navbtn.active{color:var(--primary);background:#EFEADB;}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;
  }
  .menu-card{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;margin-bottom:12px;
  }
  .menu-card .ic{font-size:26px;width:44px;height:44px;background:#EFEADB;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .menu-card .txt strong{display:block;font-size:15px;color:var(--primary);font-family:var(--font-display);}
  .menu-card .txt span{font-size:12.5px;color:var(--ink-soft);}

  .list-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:13px 14px;margin-bottom:8px;
  }
  .list-item .name{font-weight:600;font-size:14.5px;}
  .list-item .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .tag{font-size:10.5px;padding:3px 8px;border-radius:999px;font-weight:600;}
  .tag.ativo{background:#E3EEE5;color:var(--success);}
  .tag.inativo{background:#F1E4DF;color:var(--danger);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;
    background:var(--surface);font-size:14.5px;color:var(--ink);
  }
  .field textarea{font-family:'SF Mono',Consolas,monospace;font-size:12.5px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .search-box{position:relative;margin-bottom:14px;}
  .search-box input{width:100%;padding:11px 12px 11px 36px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:14px;}
  .search-box .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:12px 18px;border-radius:10px;border:none;font-weight:600;font-size:14.5px;width:100%;
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-secondary{background:var(--primary);color:#F4EFE2;}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--ink);}
  .btn-danger{background:#F1E4DF;color:var(--danger);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}
  .fab{
    position:fixed;bottom:86px;right:calc(50% - 240px + 18px);
    background:var(--accent);color:var(--accent-ink);border:none;
    width:52px;height:52px;border-radius:16px;font-size:24px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.18);z-index:15;
  }
  @media (max-width:520px){.fab{right:18px;}}

  .overlay{
    position:fixed;inset:0;background:rgba(20,26,22,.45);z-index:30;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    background:var(--bg);width:100%;max-width:480px;border-radius:20px 20px 0 0;
    max-height:92vh;overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(16px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .sheet-head h2{font-size:18px;}
  .close-x{background:#EFEADB;border:none;width:30px;height:30px;border-radius:9px;font-size:15px;color:var(--ink-soft);}

  .empty{text-align:center;padding:40px 12px;color:var(--ink-soft);}
  .empty .ic{font-size:34px;margin-bottom:8px;}
  .empty p{font-size:13.5px;margin:4px 0 0;}

  .divider{height:1px;background:var(--border);margin:16px 0;}
  .small{font-size:12px;color:var(--ink-soft);}
  .msg{font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:12px;}
  .msg.error{background:#F1E4DF;color:var(--danger);}
  .msg.ok{background:#E3EEE5;color:var(--success);}

  .check-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;
  }
  .check-row.presente{border-color:var(--success);background:#F1F7F2;}
  .toggle-pill{
    border:1.5px solid var(--border);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;
    background:var(--surface);color:var(--ink-soft);flex-shrink:0;
  }
  .toggle-pill.on{background:var(--success);border-color:var(--success);color:#fff;}

  .stat-row{display:flex;gap:10px;margin-bottom:14px;}
  .stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
  .stat .num{font-family:var(--font-display);font-size:22px;color:var(--primary);}
  .stat .lbl{font-size:11px;color:var(--ink-soft);}

  .center-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 26px;}
  .center-screen h1{font-size:26px;margin-bottom:6px;}
  .center-screen .lead{color:var(--ink-soft);font-size:14px;margin-bottom:26px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .brand .mark{width:40px;height:40px;background:var(--primary);border-radius:11px;display:flex;align-items:center;justify-content:center;color:#F4EFE2;font-size:19px;}

  .chip-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);font-size:13px;background:var(--surface);color:var(--ink-soft);font-weight:600;}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#F4EFE2;}

  .report-block{margin-bottom:16px;}
  .report-block .title{font-family:var(--font-display);font-size:15px;color:var(--primary);margin-bottom:6px;}
  .report-block .sub{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
  .pill-list{display:flex;flex-wrap:wrap;gap:6px;}
  .pill-list span{background:#EFEADB;color:var(--primary);font-size:12px;padding:4px 10px;border-radius:999px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ CAMADA DE DADOS (localStorage) ============ */
const DB = {
  get(key, def){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }catch(e){ return def; } },
  set(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
};
const KEYS = { alunos:'pc_alunos', aulas:'pc_aulas', presencas:'pc_presencas', auth:'pc_auth', fbConfig:'pc_firebase_config' };

let state = {
  alunos: DB.get(KEYS.alunos, []),
  aulas: DB.get(KEYS.aulas, []),
  presencas: DB.get(KEYS.presencas, []),
  auth: DB.get(KEYS.auth, null),
  session: sessionStorage.getItem('pc_session') === '1',
  screen: 'home',
  editAlunoId: null,
  currentAulaId: null,
  reportType: 'aula',
  msg: null
};

function persist(){
  DB.set(KEYS.alunos, state.alunos);
  DB.set(KEYS.aulas, state.aulas);
  DB.set(KEYS.presencas, state.presencas);
}
function nextId(arr){ return arr.length ? Math.max(...arr.map(x=>x.id)) + 1 : 1; }
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ============ FIREBASE (nuvem gratuita, opcional) ============ */
let fb = { db:null, auth:null, uid:null, ready:false, initStarted:false, error:null };

function loadFirebaseConfig(){ return DB.get(KEYS.fbConfig, null); }
function saveFirebaseConfig(cfg){ DB.set(KEYS.fbConfig, cfg); }

async function initFirebaseIfConfigured(){
  if(fb.initStarted) return;
  const cfg = loadFirebaseConfig();
  if(!cfg) return;
  fb.initStarted = true;
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    fb.db = firebase.firestore();
    fb.auth = firebase.auth();
    try{ await fb.db.enablePersistence({synchronizeTabs:true}); }catch(e){ /* já habilitado ou não suportado neste navegador */ }
    const cred = await fb.auth.signInAnonymously();
    fb.uid = cred.user.uid;
    fb.ready = true;
    await syncInicial();
  }catch(e){
    console.error('Falha ao conectar ao Firebase', e);
    fb.error = e.message; fb.ready = false;
  }
}
function colAlunos(){ return fb.db.collection('users').doc(fb.uid).collection('alunos'); }
function colAulas(){ return fb.db.collection('users').doc(fb.uid).collection('aulas'); }
function colPresencas(){ return fb.db.collection('users').doc(fb.uid).collection('presencas'); }

async function syncInicial(){
  const [snapA, snapU, snapP] = await Promise.all([colAlunos().get(), colAulas().get(), colPresencas().get()]);
  const cloudVazio = snapA.empty && snapU.empty && snapP.empty;
  if(cloudVazio && (state.alunos.length || state.aulas.length || state.presencas.length)){
    await pushTudo();
  } else {
    if(!snapA.empty) state.alunos = snapA.docs.map(d=>d.data());
    if(!snapU.empty) state.aulas = snapU.docs.map(d=>d.data());
    if(!snapP.empty) state.presencas = snapP.docs.map(d=>d.data());
    persist();
  }
  render();
}
async function pushTudo(){
  if(!fb.ready) return;
  const ops = [];
  state.alunos.forEach(a=> ops.push(colAlunos().doc(String(a.id)).set(a)));
  state.aulas.forEach(a=> ops.push(colAulas().doc(String(a.id)).set(a)));
  state.presencas.forEach(p=> ops.push(colPresencas().doc(String(p.id)).set(p)));
  await Promise.all(ops);
}
function pushAluno(a){ if(fb.ready) colAlunos().doc(String(a.id)).set(a).catch(e=>console.error(e)); }
function pushAula(a){ if(fb.ready) colAulas().doc(String(a.id)).set(a).catch(e=>console.error(e)); }
function pushPresencas(list){ if(!fb.ready) return; list.forEach(p=> colPresencas().doc(String(p.id)).set(p).catch(e=>console.error(e))); }

async function forcarSyncNuvem(){
  if(!fb.ready) return;
  const [snapA, snapU, snapP] = await Promise.all([colAlunos().get(), colAulas().get(), colPresencas().get()]);
  state.alunos = snapA.docs.map(d=>d.data());
  state.aulas = snapU.docs.map(d=>d.data());
  state.presencas = snapP.docs.map(d=>d.data());
  persist(); closeSheet(); render();
}

/* ============ AUTENTICAÇÃO (senha local) ============ */
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ============ RENDER ============ */
const root = document.getElementById('app');

function render(){
  if(!state.auth) return renderSetup();
  if(!state.session) return renderLogin();
  root.innerHTML = `
    <div class="topbar">
      <div><h1>Passo Certo</h1><div class="sub">Controle de presença</div></div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="openConfiguracoes()" title="Nuvem">${fb.ready?'☁️':'🌥️'}</button>
        <button class="icon-btn" onclick="doLogout()" title="Sair">⏻</button>
      </div>
    </div>
    <div class="content" id="content"></div>
    ${bottomNav()}
  `;
  renderScreen();
}
function bottomNav(){
  const items = [
    {id:'home', ic:'🏠', lbl:'Início'},
    {id:'alunos', ic:'👥', lbl:'Alunos'},
    {id:'historico', ic:'✅', lbl:'Aulas'},
    {id:'relatorios', ic:'📊', lbl:'Relatórios'}
  ];
  return `<div class="bottomnav">
    ${items.map(i=>`<button class="navbtn ${state.screen===i.id?'active':''}" onclick="goTo('${i.id}')">
      <span class="ic">${i.ic}</span>${i.lbl}
    </button>`).join('')}
  </div>`;
}
function goTo(screen){ state.screen = screen; state.msg=null; render(); }

function renderScreen(){
  const c = document.getElementById('content');
  if(state.screen==='home') c.innerHTML = viewHome();
  else if(state.screen==='alunos') c.innerHTML = viewAlunos();
  else if(state.screen==='historico') c.innerHTML = viewHistorico();
  else if(state.screen==='chamada') c.innerHTML = viewChamada();
  else if(state.screen==='relatorios') c.innerHTML = viewRelatorios();
}

/* ---------- SETUP (primeira execução) ---------- */
function renderSetup(){
  root.innerHTML = `
  <div class="center-screen">
    <div class="brand"><div class="mark">📘</div><h1>Passo Certo</h1></div>
    <p class="lead">Vamos configurar sua senha de acesso. Isso protege os dados dos alunos, que ficam salvos neste aparelho (e na nuvem, se você configurar depois).</p>
    <div id="setupMsg"></div>
    <div class="field"><label>Crie uma senha</label><input id="s1" type="password" placeholder="Mínimo 4 caracteres"></div>
    <div class="field"><label>Confirme a senha</label><input id="s2" type="password"></div>
    <div class="divider"></div>
    <div class="field"><label>Pergunta de segurança (para recuperar a senha)</label>
      <select id="s3">
        <option>Nome do seu primeiro animal de estimação</option>
        <option>Cidade onde você nasceu</option>
        <option>Nome da sua primeira escola</option>
        <option>Comida favorita</option>
      </select>
    </div>
    <div class="field"><label>Resposta</label><input id="s4" type="text" placeholder="Sua resposta"></div>
    <button class="btn btn-primary" onclick="doSetup()">Concluir configuração</button>
  </div>`;
}
async function doSetup(){
  const p1=document.getElementById('s1').value, p2=document.getElementById('s2').value;
  const q=document.getElementById('s3').value, a=document.getElementById('s4').value.trim();
  const msg=document.getElementById('setupMsg');
  if(p1.length<4){ msg.innerHTML='<div class="msg error">A senha precisa ter pelo menos 4 caracteres.</div>'; return; }
  if(p1!==p2){ msg.innerHTML='<div class="msg error">As senhas não coincidem.</div>'; return; }
  if(!a){ msg.innerHTML='<div class="msg error">Preencha a resposta de segurança.</div>'; return; }
  state.auth = { passHash: await sha256(p1), question: q, answerHash: await sha256(a.toLowerCase()) };
  DB.set(KEYS.auth, state.auth);
  state.session = true; sessionStorage.setItem('pc_session','1');
  render();
  initFirebaseIfConfigured();
}

/* ---------- LOGIN ---------- */
function renderLogin(){
  root.innerHTML = `
  <div class="center-screen">
    <div class="brand"><div class="mark">📘</div><h1>Passo Certo</h1></div>
    <p class="lead">Digite sua senha para abrir o app.</p>
    <div id="loginMsg"></div>
    <div class="field"><label>Senha</label><input id="lp" type="password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary" onclick="doLogin()">Entrar</button>
    <button class="btn btn-outline" style="margin-top:10px" onclick="goRecover()">Esqueci minha senha</button>
  </div>`;
  setTimeout(()=>document.getElementById('lp') && document.getElementById('lp').focus(),50);
}
async function doLogin(){
  const p = document.getElementById('lp').value;
  const h = await sha256(p);
  if(h === state.auth.passHash){
    state.session = true; sessionStorage.setItem('pc_session','1'); render();
    initFirebaseIfConfigured();
  } else {
    document.getElementById('loginMsg').innerHTML = '<div class="msg error">Senha incorreta.</div>';
  }
}
function doLogout(){ state.session=false; sessionStorage.removeItem('pc_session'); render(); }

function goRecover(){
  root.innerHTML = `
  <div class="center-screen">
    <h1>Recuperar senha</h1>
    <p class="lead">${state.auth.question}</p>
    <div id="recMsg"></div>
    <div class="field"><label>Sua resposta</label><input id="ra" type="text"></div>
    <div class="field"><label>Nova senha</label><input id="rp1" type="password"></div>
    <div class="field"><label>Confirme a nova senha</label><input id="rp2" type="password"></div>
    <button class="btn btn-primary" onclick="doRecover()">Redefinir senha</button>
    <button class="btn btn-outline" style="margin-top:10px" onclick="render()">Voltar</button>
  </div>`;
}
async function doRecover(){
  const a = document.getElementById('ra').value.trim().toLowerCase();
  const p1 = document.getElementById('rp1').value, p2 = document.getElementById('rp2').value;
  const msg = document.getElementById('recMsg');
  const ah = await sha256(a);
  if(ah !== state.auth.answerHash){ msg.innerHTML='<div class="msg error">Resposta incorreta.</div>'; return; }
  if(p1.length<4 || p1!==p2){ msg.innerHTML='<div class="msg error">As senhas devem coincidir e ter ao menos 4 caracteres.</div>'; return; }
  state.auth.passHash = await sha256(p1);
  DB.set(KEYS.auth, state.auth);
  state.session = true; sessionStorage.setItem('pc_session','1');
  render();
}

/* ---------- HOME ---------- */
function viewHome(){
  const alunosAtivos = state.alunos.filter(a=>!a.dataDesativacao).length;
  const totalAulas = state.aulas.length;
  return `
  <div class="stat-row">
    <div class="stat"><div class="num">${alunosAtivos}</div><div class="lbl">Alunos ativos</div></div>
    <div class="stat"><div class="num">${totalAulas}</div><div class="lbl">Aulas registradas</div></div>
  </div>
  <div class="menu-card" onclick="goTo('alunos')"><div class="ic">👥</div><div class="txt"><strong>Alunos</strong><span>Cadastrar, editar e pesquisar</span></div></div>
  <div class="menu-card" onclick="openNovaAula()"><div class="ic">➕</div><div class="txt"><strong>Nova aula</strong><span>Iniciar chamada de hoje</span></div></div>
  <div class="menu-card" onclick="goTo('historico')"><div class="ic">🗂️</div><div class="txt"><strong>Histórico de aulas</strong><span>Ver aulas já registradas</span></div></div>
  <div class="menu-card" onclick="goTo('relatorios')"><div class="ic">📊</div><div class="txt"><strong>Relatórios</strong><span>Consultar e exportar</span></div></div>
  <div class="menu-card" onclick="openConfiguracoes()"><div class="ic">☁️</div><div class="txt"><strong>Nuvem (Firebase)</strong><span>${fb.ready?'Conectado — dados protegidos na nuvem':'Não conectado — configurar backup automático'}</span></div></div>
  <div class="divider"></div>
  <button class="btn btn-outline" onclick="openBackup()">💾 Backup manual (arquivo)</button>
  `;
}

/* ---------- ALUNOS ---------- */
let alunoSearch = '';
function viewAlunos(){
  const termo = alunoSearch.toLowerCase();
  const lista = state.alunos
    .filter(a => !termo || a.nome.toLowerCase().includes(termo) || (a.celular||'').toLowerCase().includes(termo))
    .sort((a,b)=>a.nome.localeCompare(b.nome));
  return `
  <div class="search-box">
    <span class="ic">🔍</span>
    <input placeholder="Buscar por nome ou celular" value="${alunoSearch}" oninput="alunoSearch=this.value; renderScreen()">
  </div>
  ${lista.length===0 ? `<div class="empty"><div class="ic">👥</div><p>Nenhum aluno encontrado. Toque em + para cadastrar.</p></div>` :
    lista.map(a=>`
    <div class="list-item" onclick="openAlunoForm(${a.id})">
      <div>
        <div class="name">${a.nome}</div>
        <div class="meta">${a.celular || a.email || 'Sem contato cadastrado'}</div>
      </div>
      <span class="tag ${a.dataDesativacao?'inativo':'ativo'}">${a.dataDesativacao?'Inativo':'Ativo'}</span>
    </div>`).join('')}
  <button class="fab" onclick="openAlunoForm(null)">+</button>
  `;
}
function openAlunoForm(id){
  state.editAlunoId = id;
  const a = id ? state.alunos.find(x=>x.id===id) : null;
  showSheet(`
    <div class="sheet-head"><h2>${a?'Editar aluno':'Novo aluno'}</h2><button class="close-x" onclick="closeSheet()">✕</button></div>
    <div id="alunoMsg"></div>
    <div class="field"><label>Nome completo *</label><input id="fNome" value="${a?a.nome:''}" placeholder="Único campo obrigatório"></div>
    <div class="field"><label>Data de nascimento (opcional)</label><input id="fNasc" type="date" value="${a&&a.nascimento?a.nascimento:''}"></div>
    <div class="field"><label>Celular (opcional)</label><input id="fCel" value="${a&&a.celular?a.celular:''}" placeholder="(00) 00000-0000"></div>
    <div class="field"><label>E-mail (opcional)</label><input id="fEmail" type="email" value="${a&&a.email?a.email:''}"></div>
    <button class="btn btn-primary" onclick="salvarAluno()">Salvar</button>
    ${a?`<div class="btn-row" style="margin-top:10px">
      <button class="btn ${a.dataDesativacao?'btn-outline':'btn-danger'}" onclick="toggleAtivo(${a.id})">${a.dataDesativacao?'Reativar aluno':'Desativar aluno'}</button>
    </div>`:''}
  `);
}
function salvarAluno(){
  const nome = document.getElementById('fNome').value.trim();
  const nascimento = document.getElementById('fNasc').value;
  const celular = document.getElementById('fCel').value.trim();
  const email = document.getElementById('fEmail').value.trim();
  const msg = document.getElementById('alunoMsg');
  if(!nome){ msg.innerHTML='<div class="msg error">Informe ao menos o nome do aluno.</div>'; return; }
  let alunoSalvo;
  if(state.editAlunoId){
    alunoSalvo = state.alunos.find(x=>x.id===state.editAlunoId);
    Object.assign(alunoSalvo, {nome, nascimento, celular, email});
  } else {
    alunoSalvo = {id: nextId(state.alunos), nome, nascimento, celular, email, dataDesativacao:null};
    state.alunos.push(alunoSalvo);
  }
  persist(); pushAluno(alunoSalvo); closeSheet(); renderScreen();
}
function toggleAtivo(id){
  const a = state.alunos.find(x=>x.id===id);
  a.dataDesativacao = a.dataDesativacao ? null : todayISO();
  persist(); pushAluno(a); closeSheet(); renderScreen();
}

/* ---------- NOVA AULA ---------- */
function openNovaAula(){
  showSheet(`
    <div class="sheet-head"><h2>Nova aula</h2><button class="close-x" onclick="closeSheet()">✕</button></div>
    <div class="field"><label>Data da aula</label><input id="naData" type="date" value="${todayISO()}"></div>
    <div class="field"><label>Observações (opcional)</label><textarea id="naObs" rows="3" placeholder="Ex: aula de reposição" style="font-family:var(--font-body);font-size:14.5px"></textarea></div>
    <button class="btn btn-primary" onclick="criarAula()">Iniciar chamada</button>
  `);
}
function criarAula(){
  const data = document.getElementById('naData').value || todayISO();
  const obs = document.getElementById('naObs').value.trim();
  const aula = {id: nextId(state.aulas), data, observacoes: obs};
  state.aulas.push(aula);
  persist(); pushAula(aula); closeSheet();
  state.currentAulaId = aula.id;
  state.screen = 'chamada';
  render();
}

/* ---------- HISTÓRICO DE AULAS ---------- */
function viewHistorico(){
  const lista = [...state.aulas].sort((a,b)=> b.data.localeCompare(a.data) || b.id-a.id);
  return `
  ${lista.length===0 ? `<div class="empty"><div class="ic">🗂️</div><p>Nenhuma aula registrada ainda.</p></div>` :
    lista.map(au=>{
      const pres = state.presencas.filter(p=>p.idAula===au.id);
      const presentes = pres.filter(p=>p.status==='PRESENTE').length;
      return `<div class="list-item" onclick="abrirAula(${au.id})">
        <div><div class="name">Aula de ${fmtDate(au.data)}</div>
        <div class="meta">${pres.length? presentes+' presentes de '+pres.length : 'Chamada não finalizada'}${au.observacoes?' · '+au.observacoes:''}</div></div>
        <span>›</span>
      </div>`;
    }).join('')}
  <button class="fab" onclick="openNovaAula()">+</button>
  `;
}
function abrirAula(id){ state.currentAulaId = id; state.screen='chamada'; render(); }

/* ---------- CHAMADA ---------- */
let chamadaSearch = '';
let chamadaMarcados = null;
function viewChamada(){
  const aula = state.aulas.find(a=>a.id===state.currentAulaId);
  if(!aula) return `<div class="empty"><p>Aula não encontrada.</p></div>`;
  const existentes = state.presencas.filter(p=>p.idAula===aula.id);
  if(chamadaMarcados===null){
    chamadaMarcados = new Set(existentes.filter(p=>p.status==='PRESENTE').map(p=>p.idAluno));
  }
  const ativos = state.alunos.filter(a=>!a.dataDesativacao)
    .filter(a=>!chamadaSearch || a.nome.toLowerCase().includes(chamadaSearch.toLowerCase()))
    .sort((a,b)=>a.nome.localeCompare(b.nome));
  const totalPresentes = chamadaMarcados.size;
  return `
  <button class="btn btn-outline" style="margin-bottom:12px" onclick="chamadaMarcados=null; goTo('historico')">← Voltar</button>
  <h2 style="margin-bottom:4px">Aula de ${fmtDate(aula.data)}</h2>
  <p class="small" style="margin-bottom:12px">${aula.observacoes||'Sem observações'} · ${totalPresentes} presente(s) de ${state.alunos.filter(a=>!a.dataDesativacao).length} ativos</p>
  <div class="search-box"><span class="ic">🔍</span><input placeholder="Buscar aluno" value="${chamadaSearch}" oninput="chamadaSearch=this.value; renderScreen()"></div>
  ${ativos.length===0? `<div class="empty"><p>Nenhum aluno ativo cadastrado.</p></div>` :
    ativos.map(a=>{
      const on = chamadaMarcados.has(a.id);
      return `<div class="check-row ${on?'presente':''}" onclick="toggleMarcado(${a.id})">
        <span>${a.nome}</span>
        <span class="toggle-pill ${on?'on':''}">${on?'✓ Presente':'Ausente'}</span>
      </div>`;
    }).join('')}
  <div style="height:14px"></div>
  <button class="btn btn-secondary" onclick="confirmarFinalizar(${aula.id})">Finalizar aula</button>
  `;
}
function toggleMarcado(id){
  if(chamadaMarcados.has(id)) chamadaMarcados.delete(id); else chamadaMarcados.add(id);
  renderScreen();
}
function confirmarFinalizar(aulaId){
  const ativos = state.alunos.filter(a=>!a.dataDesativacao);
  const presentes = chamadaMarcados.size;
  const ausentes = ativos.length - presentes;
  showSheet(`
    <div class="sheet-head"><h2>Confirmar chamada</h2><button class="close-x" onclick="closeSheet()">✕</button></div>
    <p>Você está prestes a gravar esta chamada definitivamente:</p>
    <div class="stat-row">
      <div class="stat"><div class="num">${presentes}</div><div class="lbl">Presentes</div></div>
      <div class="stat"><div class="num">${ausentes}</div><div class="lbl">Ausentes</div></div>
    </div>
    <button class="btn btn-primary" onclick="finalizarAula(${aulaId})">Confirmar e gravar</button>
    <button class="btn btn-outline" style="margin-top:10px" onclick="closeSheet()">Cancelar</button>
  `);
}
function finalizarAula(aulaId){
  state.presencas = state.presencas.filter(p=>p.idAula!==aulaId);
  const novos = state.alunos.filter(a=>!a.dataDesativacao).map(a=>({
    id: `${aulaId}_${a.id}`,
    idAluno: a.id, idAula: aulaId,
    status: chamadaMarcados.has(a.id) ? 'PRESENTE' : 'AUSENTE'
  }));
  state.presencas.push(...novos);
  persist(); pushPresencas(novos); closeSheet(); chamadaMarcados=null;
  state.screen='historico'; render();
}

/* ---------- RELATÓRIOS ---------- */
function viewRelatorios(){
  return `
  <div class="chip-row">
    <button class="chip ${state.reportType==='aula'?'active':''}" onclick="state.reportType='aula'; renderScreen()">Aula × Alunos presentes</button>
    <button class="chip ${state.reportType==='aluno'?'active':''}" onclick="state.reportType='aluno'; renderScreen()">Aluno × Aulas presentes</button>
  </div>
  ${state.reportType==='aula' ? relatorioAulaForm() : relatorioAlunoForm()}
  `;
}
function relatorioAulaForm(){
  return `
  <div class="card">
    <div class="field"><label>Data inicial</label><input id="rfDataIni" type="date"></div>
    <div class="field"><label>Data final</label><input id="rfDataFim" type="date"></div>
    <button class="btn btn-primary" onclick="gerarRelatorioAula()">Gerar relatório</button>
  </div>
  <div id="reportResult"></div>
  `;
}
function relatorioAlunoForm(){
  const alunosOrdenados = [...state.alunos].sort((a,b)=>a.nome.localeCompare(b.nome));
  return `
  <div class="card">
    <div class="field"><label>Aluno</label>
      <select id="rfNome">
        <option value="">Todos os alunos</option>
        ${alunosOrdenados.map(a=>`<option value="${a.id}">${a.nome}${a.dataDesativacao?' (inativo)':''}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Data inicial</label><input id="rfDataIni2" type="date"></div>
    <div class="field"><label>Data final</label><input id="rfDataFim2" type="date"></div>
    <button class="btn btn-primary" onclick="gerarRelatorioAluno()">Gerar relatório</button>
  </div>
  <div id="reportResult"></div>
  `;
}
let lastReport = null;

function gerarRelatorioAula(){
  const ini = document.getElementById('rfDataIni').value || '0000-01-01';
  const fim = document.getElementById('rfDataFim').value || '9999-12-31';
  const aulas = state.aulas.filter(a=>a.data>=ini && a.data<=fim).sort((a,b)=>a.data.localeCompare(b.data));
  const dados = aulas.map(au=>{
    const nomes = state.presencas.filter(p=>p.idAula===au.id && p.status==='PRESENTE')
      .map(p=>state.alunos.find(a=>a.id===p.idAluno)?.nome).filter(Boolean);
    return { aula: au, nomes };
  });
  lastReport = {tipo:'aula', dados};
  const html = dados.length===0 ? `<div class="empty"><p>Nenhuma aula encontrada no período.</p></div>` :
    dados.map(d=>`<div class="report-block">
      <div class="title">Aula de ${fmtDate(d.aula.data)}</div>
      <div class="sub">${d.nomes.length} presente(s)</div>
      <div class="pill-list">${d.nomes.length? d.nomes.map(n=>`<span>${n}</span>`).join('') : '<span>Nenhum presente</span>'}</div>
    </div>`).join('');
  document.getElementById('reportResult').innerHTML = html + exportButtons();
}
function gerarRelatorioAluno(){
  const alunoIdSel = document.getElementById('rfNome').value;
  const ini = document.getElementById('rfDataIni2').value || '0000-01-01';
  const fim = document.getElementById('rfDataFim2').value || '9999-12-31';
  const alunos = state.alunos.filter(a=> !alunoIdSel || a.id===Number(alunoIdSel)).sort((a,b)=>a.nome.localeCompare(b.nome));
  const dados = alunos.map(al=>{
    const aulas = state.presencas.filter(p=>p.idAluno===al.id && p.status==='PRESENTE')
      .map(p=>state.aulas.find(a=>a.id===p.idAula))
      .filter(a=>a && a.data>=ini && a.data<=fim)
      .sort((a,b)=>a.data.localeCompare(b.data));
    return {aluno: al, aulas};
  });
  lastReport = {tipo:'aluno', dados};
  const html = dados.length===0 ? `<div class="empty"><p>Nenhum aluno encontrado.</p></div>` :
    dados.map(d=>`<div class="report-block">
      <div class="title">${d.aluno.nome}</div>
      <div class="sub">${d.aulas.length} aula(s) presente</div>
      <div class="pill-list">${d.aulas.length? d.aulas.map(a=>`<span>${fmtDate(a.data)}</span>`).join('') : '<span>Nenhuma presença no período</span>'}</div>
    </div>`).join('');
  document.getElementById('reportResult').innerHTML = html + exportButtons();
}
function exportButtons(){
  return `<div class="btn-row" style="margin-top:6px">
    <button class="btn btn-outline" onclick="exportarPDF()">📄 Exportar PDF</button>
    <button class="btn btn-outline" onclick="exportarExcel()">📊 Exportar Excel</button>
  </div>`;
}

/* ---------- EXPORTAÇÃO PDF (com cabeçalho, colunas e cores) ---------- */
function exportarPDF(){
  if(!lastReport) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();

  function desenharCabecalho(){
    doc.setFillColor(31,58,52);
    doc.rect(0,0,pageWidth,32,'F');
    doc.setTextColor(244,239,226);
    doc.setFont(undefined,'bold'); doc.setFontSize(16);
    doc.text('Passo Certo', 14, 15);
    doc.setFont(undefined,'normal'); doc.setFontSize(10);
    const subtitulo = lastReport.tipo==='aula' ? 'Relatório de Aula x Alunos Presentes' : 'Relatório de Aluno x Aulas Presentes';
    doc.text(subtitulo, 14, 23);
    doc.setFontSize(8);
    doc.text('Gerado em ' + new Date().toLocaleString('pt-BR'), pageWidth-14, 23, {align:'right'});
  }
  desenharCabecalho();

  let head, body;
  if(lastReport.tipo==='aula'){
    head = [['Aula', 'Data', 'Aluno presente']];
    body = [];
    lastReport.dados.forEach(d=>{
      if(d.nomes.length===0) body.push([d.aula.id, fmtDate(d.aula.data), '— nenhum presente —']);
      else d.nomes.forEach((n,i)=> body.push([i===0? String(d.aula.id) : '', i===0? fmtDate(d.aula.data): '', n]));
    });
  } else {
    head = [['Aluno', 'Data da aula presente']];
    body = [];
    lastReport.dados.forEach(d=>{
      if(d.aulas.length===0) body.push([d.aluno.nome, '— nenhuma presença —']);
      else d.aulas.forEach((a,i)=> body.push([i===0? d.aluno.nome : '', fmtDate(a.data)]));
    });
  }

  doc.autoTable({
    head, body,
    startY: 40,
    theme: 'grid',
    headStyles: { fillColor: [201,154,59], textColor: [58,44,11], fontStyle:'bold', fontSize: 10 },
    alternateRowStyles: { fillColor: [250,246,238] },
    styles: { fontSize: 9, cellPadding: 5, textColor: [34,49,44], lineColor: [228,220,201] },
    margin: { left:14, right:14, top: 40 },
    didDrawPage: function(){ if(doc.internal.getCurrentPageInfo().pageNumber>1) desenharCabecalho(); }
  });

  const totalPages = doc.internal.getNumberOfPages();
  for(let i=1;i<=totalPages;i++){
    doc.setPage(i);
    doc.setFontSize(8); doc.setTextColor(120,120,120); doc.setFont(undefined,'normal');
    doc.text(`Página ${i} de ${totalPages}`, pageWidth-14, pageHeight-8, {align:'right'});
    doc.text('Passo Certo · relatório de presença', 14, pageHeight-8);
  }
  doc.save('passo-certo-relatorio.pdf');
}

function exportarExcel(){
  if(!lastReport) return;
  let rows = [];
  if(lastReport.tipo==='aula'){
    rows.push(['Aula','Data','Aluno presente']);
    lastReport.dados.forEach(d=>{
      if(d.nomes.length===0) rows.push([d.aula.id, fmtDate(d.aula.data), '']);
      else d.nomes.forEach(n=> rows.push([d.aula.id, fmtDate(d.aula.data), n]));
    });
  } else {
    rows.push(['Aluno','Data da aula presente']);
    lastReport.dados.forEach(d=>{
      if(d.aulas.length===0) rows.push([d.aluno.nome, '']);
      else d.aulas.forEach(a=> rows.push([d.aluno.nome, fmtDate(a.data)]));
    });
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Relatorio');
  XLSX.writeFile(wb, 'passo-certo-relatorio.xlsx');
}

/* ---------- CONFIGURAÇÕES / NUVEM ---------- */
function openConfiguracoes(){
  const cfg = loadFirebaseConfig();
  showSheet(`
    <div class="sheet-head"><h2>Nuvem (Firebase)</h2><button class="close-x" onclick="closeSheet()">✕</button></div>
    <p class="small">Conecte um banco de dados gratuito na nuvem (Firebase) para não depender só deste celular. Status: <strong>${fb.ready?'🟢 Conectado':(fb.error?'🔴 Erro ao conectar':'⚪ Não conectado')}</strong></p>
    ${fb.error?`<div class="msg error">${fb.error}</div>`:''}
    <div class="field"><label>Cole aqui o firebaseConfig copiado do console do Firebase</label>
      <textarea id="fbConfigInput" rows="7" placeholder='{ apiKey: "...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." }'>${cfg?JSON.stringify(cfg,null,2):''}</textarea>
    </div>
    <div id="fbMsg"></div>
    <button class="btn btn-primary" onclick="salvarConfigFirebase()">Salvar e conectar</button>
    ${fb.ready?`
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn-outline" onclick="forcarSyncNuvem()">🔄 Puxar da nuvem</button>
      <button class="btn btn-outline" onclick="pushTudo().then(()=>{ document.getElementById('fbMsg').innerHTML='<div class=\\'msg ok\\'>Dados enviados para a nuvem.</div>'; })">⬆️ Enviar local</button>
    </div>`:''}
  `);
}
function salvarConfigFirebase(){
  const txt = document.getElementById('fbConfigInput').value.trim();
  const msg = document.getElementById('fbMsg');
  let cfg;
  try{ cfg = JSON.parse(txt); }
  catch(e){
    try{ cfg = new Function('return (' + txt + ')')(); }
    catch(e2){ msg.innerHTML = '<div class="msg error">Não consegui entender o texto colado. Copie exatamente o bloco firebaseConfig do console do Firebase.</div>'; return; }
  }
  saveFirebaseConfig(cfg);
  fb.initStarted = false; fb.ready = false; fb.error = null;
  msg.innerHTML = '<div class="msg ok">Configuração salva. Conectando...</div>';
  initFirebaseIfConfigured().then(()=>{ closeSheet(); render(); });
}

/* ---------- BACKUP MANUAL (arquivo) ---------- */
function openBackup(){
  showSheet(`
    <div class="sheet-head"><h2>Backup manual</h2><button class="close-x" onclick="closeSheet()">✕</button></div>
    <p class="small">Além da nuvem, você pode baixar um arquivo com todos os dados a qualquer momento.</p>
    <button class="btn btn-primary" onclick="exportarBackup()">⬇️ Baixar backup (.json)</button>
    <div class="divider"></div>
    <label class="field"><label>Restaurar backup</label>
      <input type="file" id="restoreFile" accept="application/json">
    </label>
    <button class="btn btn-outline" onclick="restaurarBackup()">⬆️ Restaurar a partir de arquivo</button>
  `);
}
function exportarBackup(){
  const data = { alunos: state.alunos, aulas: state.aulas, presencas: state.presencas, exportadoEm: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `passo-certo-backup-${todayISO()}.json`;
  a.click(); URL.revokeObjectURL(url);
}
function restaurarBackup(){
  const file = document.getElementById('restoreFile').files[0];
  if(!file) return alert('Escolha um arquivo de backup primeiro.');
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('Isso vai substituir os dados atuais pelos dados do backup. Continuar?')) return;
      state.alunos = data.alunos||[]; state.aulas = data.aulas||[]; state.presencas = data.presencas||[];
      persist(); if(fb.ready) pushTudo(); closeSheet(); render();
    }catch(err){ alert('Arquivo de backup inválido.'); }
  };
  reader.readAsText(file);
}

/* ---------- SHEET (modal) ---------- */
function showSheet(html){
  let ov = document.getElementById('overlay');
  if(!ov){ ov = document.createElement('div'); ov.id='overlay'; ov.className='overlay'; document.body.appendChild(ov); }
  ov.innerHTML = `<div class="sheet">${html}</div>`;
  ov.onclick = (e)=>{ if(e.target===ov) closeSheet(); };
}
function closeSheet(){ const ov = document.getElementById('overlay'); if(ov) ov.remove(); }

render();
if(state.auth && state.session) initFirebaseIfConfigured();
</script>
